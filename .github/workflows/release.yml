# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release: a vX.Y.Z tag becomes a published GitHub Release carrying the DMG, the CLI tarball, their
# checksums, the install script and the Homebrew formula.
#
# Immutable Releases are enabled on this repository: once a release is published, neither its assets
# nor the tag behind it can be edited, replaced or deleted. So this workflow publishes exactly once
# and refuses to touch an existing release. A bad release is fixed by tagging the next patch version,
# never by re-uploading assets onto the old tag.
#
# A workflow_dispatch run does the same validation and build for a version that has no tag yet and
# stops before publishing — that is the dry run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: version to build and validate (X.Y.Z, no leading v)"
        required: true
        type: string

permissions:
  contents: write

# One release at a time, and never cancelled: a cancelled job would leave a draft release or
# half-uploaded assets behind on a tag that cannot be repaired afterwards.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve the version and find it in CHANGELOG.md
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "dry run for version $VERSION: nothing will be published"
          else
            VERSION="${REF_NAME#v}"
          fi
          TAG="v$VERSION"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not vX.Y.Z: exactly three dot-separated numbers, no pre-release or build suffix" >&2
            exit 1
          fi
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' heading: freeze the CHANGELOG for $VERSION before tagging (docs/RELEASING.md)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "version $VERSION, tag $TAG, CHANGELOG section found"

      - name: Refuse to publish over an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A published release cannot be replaced or deleted while immutability is on, so the only
          # correct outcome here is to stop and let a human tag the next patch version. A leftover
          # draft from an earlier failed run is not visible to every lookup; when one exists,
          # `gh release create` below fails on the same tag instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a GitHub Release for $TAG already exists; Immutable Releases cannot be edited, so tag the next patch version instead of re-running this workflow" >&2
            exit 1
          fi
          echo "no release for $TAG yet"

      - name: make release-check (verify, release assets, checksums)
        run: make release-check VERSION="$VERSION"

      - name: Extract the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p dist
          # BSD awk, no GNU-only flags: print from the `## [X.Y.Z]` heading up to the next `## `
          # heading, then trim the blank lines at either end. index() instead of a regex so no
          # bracket has to be escaped.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { in_section = 1; next }
            in_section && index($0, "## ") == 1 { exit }
            in_section { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              i = 1
              while (i <= n && lines[i] ~ /^[[:space:]]*$/) i++
              for (; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::CHANGELOG.md has an empty section for $VERSION" >&2
            exit 1
          fi
          echo "--- release notes ---"
          cat dist/release-notes.md

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            "dist/DeepTally-${VERSION}.dmg"
            "dist/deeptally-${VERSION}-arm64.tar.gz"
            "dist/SHA256SUMS"
            "dist/install.sh"
            "dist/deeptally.rb"
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::$asset is missing: make release-check did not produce it" >&2
              exit 1
            fi
          done
          # gh creates the release as a draft, uploads the assets, then publishes it; immutability
          # is only enforced at that last step. The tag must already exist: --verify-tag.
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --notes-file dist/release-notes.md \
            "${assets[@]}"
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Verify the published CLI installs through Homebrew
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tap update is a manual step after the release, so install the formula the release
          # itself carries, through a throwaway tap: the same URL and checksum a user takes. This is
          # the check v0.1.1 needed — its formula symlinked the binary and the CLI could not find its
          # resource bundle. Failing here cannot unpublish, so it is an alarm, and the fix is the
          # next patch version (docs/RELEASING.md).
          brew tap-new local/release-verify >/dev/null
          TAPDIR="$(brew --repository local/release-verify)"
          mkdir -p "$TAPDIR/Formula"
          gh release download "$TAG" --pattern deeptally.rb --dir "$TAPDIR/Formula"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install local/release-verify/deeptally
          reported="$(deeptally --version | awk '{ print $2 }')"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::the Homebrew-installed CLI reports '$reported', not '$VERSION'" >&2
            exit 1
          fi
          deeptally rate >/dev/null
          brew test local/release-verify/deeptally
          brew uninstall deeptally
          brew untap local/release-verify
          echo "the published formula installs a working CLI"

      - name: Dry run — nothing was published
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "dry run: $TAG was validated and built but not published"
          ls -lh dist
